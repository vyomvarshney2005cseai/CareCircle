name: CareCircle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & ESLint Check
        run: npm run lint

      - name: Run Test Suite with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATA_STORE: memory
          PORT: 8080
          JWT_SECRET: ci-testing-jwt-secret-key-32-chars-long
          COOKIE_SECRET: ci-testing-cookie-secret-key-32-chars
